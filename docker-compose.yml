services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000" 
    environment:
      PYTHON_MICROSERVICE_ADDR: microservice:50051
      DATABASE_DSN: postgresql://wrink-dev:wrink-dev-123@db:5432/wrink-dev?sslmode=disable
      JWT_SECRET: "wrinkdev"
      SEARCH_SERVICE_ADDR: microservice:50051
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

    

  microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    environment:
      SELENIUM_HUB_URL: http://selenium-hub:4444/wd/hub
    depends_on:
      - selenium-hub
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    restart: always
    environment: 
      POSTGRES_USER: wrink-dev
      POSTGRES_PASSWORD: wrink-dev-123
      POSTGRES_DB: wrink-dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrink-dev -d wrink-dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - app-network

  selenium-hub:
    image: selenium/hub:latest
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    networks:
      - app-network

  chrome-node:
    image: selenium/node-chrome:latest
    shm_size: 2g
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
    networks:
      - app-network


volumes:
  pgdata:

networks:
  app-network:
    driver: bridge

