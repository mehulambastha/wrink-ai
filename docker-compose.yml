services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000" 
    environment:
      # PYTHON_MICROSERVICE_ADDR: microservice:50051
      DATABASE_DSN: postgresql://wrink-dev:wrink-dev-123@db:5432/wrink-dev?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

    

  # microservice:
  #   build:
  #     context: ./microservice
  #     dockerfile: Dockerfile
  #   ports:
  #     - "50051:50051"

  db:
    image: postgres:15-alpine
    restart: always
    environment: 
      POSTGRES_USER: wrink-dev
      POSTGRES_PASSWORD: wrink-dev-123
      POSTGRES_DB: wrink-dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrink-dev -d wrink-dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata:

